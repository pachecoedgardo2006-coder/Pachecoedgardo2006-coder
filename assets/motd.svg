<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Operator session">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="flash" cx="8%" cy="0%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="1200" height="240" fill="url(#flash)"/>
  <rect x="18" y="18" width="1164" height="204" fill="none" stroke="url(#frame)" stroke-width="1"/>
  <circle cx="42" cy="42" r="2" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1158" cy="42" r="2" fill="#ffffff" opacity="0.45"/>
  <circle cx="42" cy="198" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="1158" cy="198" r="2" fill="#ffffff" opacity="0.85" filter="url(#glow)"/>

  <text x="56" y="56" fill="#cfcfcf" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="3">ROOT@PACHECO ~ SESSION</text>
  <text x="1144" y="56" text-anchor="end" fill="#9a9a9a" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="2.4">$ whoami</text>
  <line x1="56" y1="72" x2="1144" y2="72" stroke="url(#hairline)" stroke-width="0.8"/>

  <text x="80" y="112" fill="#8a8a8a" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="2.2">OS</text>
  <text x="220" y="112" fill="#f2f2f2" font-family="Courier New, Courier, monospace" font-size="14" letter-spacing="1.2">Ubuntu Linux</text>
  <text x="680" y="112" fill="#8a8a8a" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="2.2">NODE</text>
  <text x="820" y="112" fill="#f2f2f2" font-family="Courier New, Courier, monospace" font-size="14" letter-spacing="1.2">UniCosta  x  Riwi</text>

  <text x="80" y="146" fill="#8a8a8a" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="2.2">ROLE</text>
  <text x="220" y="146" fill="#f2f2f2" font-family="Courier New, Courier, monospace" font-size="14" letter-spacing="1.2">Full-Stack &amp; Backend Developer</text>
  <text x="680" y="146" fill="#8a8a8a" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="2.2">STATE</text>
  <text x="820" y="146" fill="#ffffff" font-family="Courier New, Courier, monospace" font-size="14" letter-spacing="2.4">ACTIVE</text>

  <text x="80" y="180" fill="#8a8a8a" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="2.2">FOCUS</text>
  <text x="220" y="180" fill="#d8d8d8" font-family="Courier New, Courier, monospace" font-size="14" letter-spacing="1">APIs RESTful  |  arquitectura  |  sistemas escalables</text>
</svg>
