<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Edgardo Pacheco Secure Development Node">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="flashTL" cx="12%" cy="8%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flashBR" cx="88%" cy="86%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flashC" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.045"/>
    </pattern>
    <pattern id="scan" width="1200" height="3" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>
  <rect width="1200" height="360" fill="url(#flashTL)"/>
  <rect width="1200" height="360" fill="url(#flashBR)"/>
  <rect width="1200" height="360" fill="url(#flashC)"/>

  <rect x="-160" y="0" width="140" height="360" fill="url(#sweep)" opacity="0.85">
    <animate attributeName="x" from="-180" to="1240" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="18" y="18" width="1164" height="324" fill="none" stroke="url(#frame)" stroke-width="1"/>
  <rect x="24" y="24" width="1152" height="312" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>

  <circle cx="42" cy="42" r="2.2" fill="#ffffff" opacity="0.85" filter="url(#tinyGlow)"/>
  <circle cx="1158" cy="42" r="2.2" fill="#ffffff" opacity="0.55"/>
  <circle cx="42" cy="318" r="2.2" fill="#ffffff" opacity="0.45"/>
  <circle cx="1158" cy="318" r="2.2" fill="#ffffff" opacity="0.9" filter="url(#tinyGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text x="56" y="64" fill="#cfcfcf" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="3.2">ROOT@PACHECO ~ SECURE NODE</text>
  <text x="1144" y="64" text-anchor="end" fill="#9a9a9a" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="2.4">ACCESS // GRANTED</text>

  <line x1="56" y1="82" x2="1144" y2="82" stroke="url(#hairline)" stroke-width="1" filter="url(#tinyGlow)"/>

  <text x="600" y="168" text-anchor="middle" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="52" letter-spacing="10" filter="url(#softGlow)">EDGARDO PACHECO</text>
  <text x="600" y="206" text-anchor="middle" fill="#d8d8d8" font-family="Courier New, Courier, monospace" font-size="15" letter-spacing="6.5">FULL-STACK  |  BACKEND  |  DEVSECOPS</text>

  <line x1="360" y1="230" x2="840" y2="230" stroke="url(#hairline)" stroke-width="0.8"/>

  <text x="600" y="268" text-anchor="middle" fill="#bdbdbd" font-family="Courier New, Courier, monospace" font-size="13" letter-spacing="1.6">$ whoami  --  Systems Engineering @ UniCosta  |  Trainee @ Riwi</text>
  <text x="600" y="298" text-anchor="middle" fill="#8f8f8f" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="2.2">UBUNTU  //  CLEAN ARCHITECTURE  //  LOCAL AI  //  STATUS: ACTIVE</text>
</svg>
